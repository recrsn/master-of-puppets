<style>

--color-cui-cr-orange-3:#331e0b;--color-cui-cr-orange-7:#7e451d;--color-cui-cr-orange-9:#ff570a;--color-cui-cr-orange-11:#ffa057;
--color-cui-red-3:#3a141e;--color-cui-red-7:#883447;--color-cui-red-9:#e54666;--color-cui-red-11:#ff949d;

--background-color-cui-base-0:var(--color-cui-mauve-1);--background-color-cui-base-1:var(--color-cui-mauve-2);--background-color-cui-base-2:var(--color-cui-mauve-3);

/* Fonts: Geist and Hack when online, else the system stacks */
@font-face{font-family:"Geist Variable";font-style:normal;font-display:swap;font-weight:100 900;src:url(https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@5/files/geist-latin-wght-normal.woff2) format("woff2-variations")}
@font-face{font-family:"Hack";font-style:normal;font-weight:400;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/hack-font@3/build/web/fonts/hack-regular.woff2) format("woff2")}

:root{--font-cui-sans:"Geist Variable",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;

/* Base */
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--background-color-cui-base-0);color:var(--text-color-cui-primary);font-family:var(--font-cui-sans);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
::selection{background:oklch(0.28 0.005 55);color:var(--color-cui-mauve-1)}

h2{margin:0;font-size:14px;line-height:20px;font-weight:600}
p{margin:0;text-wrap:pretty}

.ok{color:var(--text-color-cui-success)} .warn{color:var(--text-color-cui-warn)} .danger{color:var(--text-color-cui-danger)}
.wrap{overflow-wrap:anywhere}
.none{padding:0 12px;color:var(--text-color-cui-tertiary)}
.n{font-family:var(--font-cui-mono);font-size:12px;line-height:16px;color:var(--text-color-cui-tertiary)}
.btn{display:inline-flex;align-items:center;height:28px;padding:0 10px;border:none;border-radius:4px;background:var(--background-color-cui-base-2);box-shadow:var(--inset-shadow-cui-button),0 0 0 1px var(--border-color-cui-neutral),var(--shadow-cui-xs);color:var(--text-color-cui-primary);font:500 14px/20px var(--font-cui-sans);text-decoration:none;white-space:nowrap;cursor:pointer}
.btn:hover{background:var(--background-color-cui-base-1);color:var(--text-color-cui-primary)}

/* Desk */
main.desk{display:flex;max-width:1280px;margin:0 auto;padding:32px 24px;flex-wrap:wrap;gap:48px;align-items:flex-start}

.col-side{flex:1 1 300px;max-width:100%;min-width:0;display:flex;flex-direction:column;gap:20px}

.sec.needs{gap:16px}

.grp{display:flex;flex-direction:column}
.sec:not(.needs) .grp+.grp{margin-top:20px}
.grp-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;padding:0 12px 4px;font-size:12px;line-height:16px;color:var(--text-color-cui-tertiary)}
.grp-l{font-weight:500;color:var(--text-color-cui-secondary)}
details[data-fold]>summary{align-items:center}
details[data-fold]>summary::before{content:"";flex:none;width:5px;height:5px;margin:0 2px;border:solid currentColor;border-width:0 1.5px 1.5px 0;transform:rotate(45deg) translate(-1px,-1px);transition:transform .15s}

.parkform{display:inline-flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;background:var(--background-color-cui-subtle)}
.parkform input{height:24px;padding:0 6px;border:1px solid var(--border-color-cui-neutral);border-radius:4px;background:var(--background-color-cui-base-2);color:var(--text-color-cui-primary);font:500 12px/16px var(--font-cui-sans)}
.parkform .hint{font:400 12px/16px var(--font-cui-sans);color:var(--text-color-cui-tertiary)}
.toast{position:fixed;left:50%;bottom:20px;z-index:30;transform:translateX(-50%);max-width:min(640px,calc(100% - 40px));display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-radius:8px;background:var(--background-color-cui-base-2);box-shadow:var(--shadow-cui-xl),0 0 0 1px var(--border-color-cui-neutral);font-size:12px;line-height:16px;color:var(--text-color-cui-secondary)}
.toast b{font-size:14px;line-height:20px;font-weight:500;color:var(--text-color-cui-primary)} .toast.bad b{color:var(--text-color-cui-danger)}

/* Leases */
.leases{gap:20px} .leases .sec-h{justify-content:space-between;padding:0}

.q-req>span{display:inline-flex;align-items:center;gap:4px}
.ic{flex:none;width:12px;height:12px}

.q-pos{flex:none;display:inline-flex;align-items:center;justify-content:center;width:12px;font-family:var(--font-cui-mono);font-size:12px;color:var(--text-color-cui-tertiary)}

@media (prefers-reduced-motion:reduce){.dot.live{animation:none}}

/* Events, Config and Rules pages */
main.page{max-width:960px;margin:0 auto;padding:32px 24px;display:flex;flex-direction:column;gap:32px}

.log{display:flex;flex-direction:column;border-top:1px solid var(--border-color-cui-neutral)}

.card+.card{margin-top:8px}
.card-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font-weight:600}

form.cfg:not([data-dirty]) .btn[type=submit]{opacity:.5}
.coords{display:flex;flex-direction:column;gap:14px;padding:0 12px}
.coords .none{padding:0}
.coord{display:flex;flex-direction:column;gap:2px}
.c-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;font-size:12px;line-height:16px}

.notes{margin:4px 0 0;padding-left:16px;font-size:12px;line-height:16px;color:var(--text-color-cui-secondary)}
.entry{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-bottom:1px solid var(--border-color-cui-neutral)}
</style>
<script>
(() => {
  const root = document.documentElement;
  const dark = matchMedia("(prefers-color-scheme: dark)");
  const theme = () => { root.dataset.theme = dark.matches ? "dark" : "light"; };
  theme();
  dark.addEventListener("change", theme);

  // The page body is replaced on each update; this state lives outside it.
  const open = new Set(JSON.parse(localStorage.getItem("mop-open") || "[]"));
  // Groups marked data-fold start open; this holds the ones collapsed.
  const shut = new Set(JSON.parse(localStorage.getItem("mop-shut") || "[]"));
  // An open Park form: {coord, name, until}; redrawn after each body swap.
  let parkForm = null;

  const paint = (h) => {
    if (!h || !h.tiles) return;
    for (const t of h.tiles) {
      for (const el of document.querySelectorAll(`[data-host="${t.id}"]`)) {
        el.dataset.sev = t.sev;
        el.title = `${t.label} ${t.value} · ${t.sub}`;
        for (const k of el.querySelectorAll("[data-k]")) k.textContent = t[k.dataset.k];
      }
    }
    const minis = document.getElementById("minis");
    if (minis) minis.title = "Host " + h.at;
  };
  // The result of a queue action, shown for 10 s.
  let toast = null;
  const drawToast = () => {
    document.getElementById("toast")?.remove();
    if (!toast || Date.now() > toast.until) return;
    const el = document.createElement("div");
    el.id = "toast";
    el.className = "toast" + (toast.ok ? "" : " bad");
    el.setAttribute("role", "status");
    toast.lines.forEach((line, i) => {
      const s = document.createElement(i ? "span" : "b");
      s.textContent = line;
      el.append(s);
    });
    document.body.append(el);
  };
  const showToast = (ok, lines) => {
    toast = {ok, lines, until: Date.now() + 10000};
    drawToast();
    setTimeout(drawToast, 10050);
  };
  const queueAction = async (btn) => {
    const {q: action, cls, id} = btn.dataset;
    if (action === "unwait" && !confirm(`Cancel ${cls} queue entry ${id}? Its coordinator gets a message.`)) return;
    btn.disabled = true;
    try {
      const r = await fetch("/queue", {method: "POST", headers: {"Content-Type": "application/json", "X-Requested-By": "dashboard"},
                                       body: JSON.stringify({action, cls, id})});
      const res = await r.json().catch(() => ({ok: false, lines: [`HTTP ${r.status}`]}));
      showToast(res.ok, res.lines);
    } catch (err) {
      showToast(false, ["Request failed", String(err)]);
    } finally {
      btn.disabled = false;
    }
  };

  // Drag a ready queue entry onto another ready entry of its class to take that position.
  // The page holds updates during a drag, since a body swap ends it.
  let drag = null, held = false;
  const dropRow = (ev) => {
    const row = ev.target.closest?.(".row.q[data-drag]");
    return drag && row && row.dataset.drag === drag.cls && row.dataset.id !== drag.id ? row : null;
  };
  const clearDrop = () => { for (const r of document.querySelectorAll(".drop-before,.drop-after")) r.classList.remove("drop-before", "drop-after"); };
  document.addEventListener("dragstart", (ev) => {
    const row = ev.target.closest?.(".row.q[data-drag]");
    if (!row) return;
    drag = {cls: row.dataset.drag, id: row.dataset.id, pos: Number(row.dataset.pos)};
    ev.dataTransfer.effectAllowed = "move";
    ev.dataTransfer.setData("text/plain", drag.id);
    row.classList.add("dragging");
  });
  document.addEventListener("dragover", (ev) => {
    const row = dropRow(ev);
    if (!row) return;
    ev.preventDefault();
    ev.dataTransfer.dropEffect = "move";
    clearDrop();
    row.classList.add(Number(row.dataset.pos) < drag.pos ? "drop-before" : "drop-after");
  });
  document.addEventListener("dragleave", (ev) => { if (dropRow(ev)) clearDrop(); });
  document.addEventListener("drop", (ev) => {
    const row = dropRow(ev);
    if (!row) return;
    ev.preventDefault();
    const {cls, id} = drag;
    post("/queue", {action: "move", cls, id, to: Number(row.dataset.pos)});
  });
  document.addEventListener("dragend", () => {
    clearDrop();
    document.querySelector(".dragging")?.classList.remove("dragging");
    drag = null;
    if (held) { held = false; refresh(); }
  });

  const post = async (url, body, btn) => {
    if (btn) btn.disabled = true;
    try {
      const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json", "X-Requested-By": "dashboard"},
                                  body: JSON.stringify(body)});
      const res = await r.json().catch(() => ({ok: false, lines: [`HTTP ${r.status}`]}));
      showToast(res.ok, res.lines);
      return res.ok;
    } catch (err) {
      showToast(false, ["Request failed", String(err)]);
      return false;
    } finally {
      if (btn) btn.disabled = false;
    }
  };
  const findPark = (coord, name) =>
    [...document.querySelectorAll('[data-park="park"]')].find((b) => b.dataset.coord === coord && b.dataset.name === name);
  const drawParkForm = () => {
    document.querySelector(".parkform")?.remove();
    if (!parkForm) return;
    const anchor = findPark(parkForm.coord, parkForm.name);
    if (!anchor) return;
    const f = document.createElement("span");
    f.className = "parkform";
    const today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    f.innerHTML = '<input type="date" aria-label="Park until"><button type="button" class="ghost" data-park-go>Park</button>' +
                  '<button type="button" class="ghost cancel" data-park-cancel>Cancel</button><span class="hint">no date: until unparked</span>';
    const input = f.querySelector("input");
    input.min = today;
    input.value = parkForm.until || "";
    input.addEventListener("input", () => { parkForm.until = input.value; });
    anchor.after(f);
    input.focus();
  };
  const parkClick = async (btn) => {
    const {park: action, coord, name} = btn.dataset;
    if (action === "unpark") {
      if (confirm(`Unpark ${name}? Its coordinator gets a message.`)) await post("/park", {action, coord, name}, btn);
      return;
    }
    parkForm = {coord, name, until: ""};
    drawParkForm();
  };

  const decide = async (btn) => {
    const {coord, id} = btn.dataset;
    const choice = Number(btn.dataset.decide);
    if (confirm(`Answer "${btn.textContent}"? ${coord} gets it as your decision.`)) await post("/decide", {coord, id, choice}, btn);
  };

  const sync = () => {
    for (const d of document.querySelectorAll("details[id]")) d.open = "fold" in d.dataset ? !shut.has(d.id) : open.has(d.id);
    drawToast();
    paint(window.__host);
    drawParkForm();
  };

  document.addEventListener("toggle", (ev) => {
    const d = ev.target;
    if (!d.id) return;
    if ("fold" in d.dataset) {
      if (d.open) shut.delete(d.id); else shut.add(d.id);
      localStorage.setItem("mop-shut", JSON.stringify([...shut]));
      return;
    }
    if (d.open) open.add(d.id); else open.delete(d.id);
    localStorage.setItem("mop-open", JSON.stringify([...open]));
  }, true);
  // Config and Rules forms post JSON with the changed fields only; hidden and data-always fields always go.
  const changedFields = (form) => {
    const out = {};
    for (const el of form.elements) {
      if (!el.name || el.name === "__reason") continue;
      const was = el.tagName === "SELECT" ? ([...el.options].find((o) => o.defaultSelected) || el.options[0]).value : el.defaultValue;
      if (el.type === "hidden" || "always" in el.dataset || el.value !== was) out[el.name] = el.value;
    }
    return out;
  };
  const refresh = async () => {
    const r = await fetch(location.pathname, {cache: "no-store"});
    if (!r.ok) return;
    const doc = new DOMParser().parseFromString(await r.text(), "text/html");
    const y = window.scrollY;
    document.body.innerHTML = doc.body.innerHTML;
    sync();
    window.scrollTo(0, y);
  };
  const send = async (url, data, reason, btn) => {
    const body = url === "/config" ? {cmd: data.cmd, args: Object.fromEntries(Object.entries(data).filter(([k]) => k !== "cmd")), reason}
                                   : {...data, reason};
    if (await post(url, body, btn)) refresh();
  };
  document.addEventListener("input", (ev) => {
    const f = ev.target.closest("form.cfg");
    if (f) f.dataset.dirty = "1";
  });
  document.addEventListener("submit", (ev) => {
    const f = ev.target.closest("form.cfg");
    if (!f) return;
    ev.preventDefault();
    if (!f.dataset.dirty) { showToast(true, ["No changes"]); return; }
    send(f.dataset.post, changedFields(f), f.elements.__reason.value, f.querySelector("[type=submit]"));
  });
  document.addEventListener("click", (ev) => {
    const q = ev.target.closest("[data-q]");
    const pk = ev.target.closest("[data-park]");
    const dc = ev.target.closest("[data-decide]");
    const rc = ev.target.closest("[data-remove-class]");
    const rr = ev.target.closest("[data-remove-rule]");
    if (rc) {
      const name = rc.dataset.removeClass;
      if (confirm(`Remove lease class ${name}? Every live coordinator and member gets a message.`))
        send("/config", {cmd: "remove-class", name}, rc.closest("form").elements.__reason.value, rc);
    } else if (rr) {
      if (confirm(`Remove ${rr.dataset.removeRule}? Every live coordinator and member gets a message.`))
        send("/memory", {action: "remove", scope: rr.dataset.scope, id: rr.dataset.removeRule}, rr.closest("form").elements.__reason.value, rr);
    } else if (dc) {
      decide(dc);
    } else if (pk) {
      parkClick(pk);
    } else if (ev.target.closest("[data-park-go]")) {
      const {coord, name, until} = parkForm;
      parkForm = null;
      drawParkForm();
      post("/park", {action: "park", coord, name, until});
    } else if (ev.target.closest("[data-park-cancel]")) {
      parkForm = null;
      drawParkForm();
    } else if (q) {
      queueAction(q);
    }
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key !== "Escape") return;
    if (parkForm) { parkForm = null; drawParkForm(); }
  });
  document.addEventListener("DOMContentLoaded", sync);

  if (!window.EventSource || location.protocol === "file:") return;
  const es = new EventSource("/stream");
  es.addEventListener("host", (ev) => { window.__host = JSON.parse(ev.data); paint(window.__host); });
  // A form with unsaved edits holds the page until it is saved.
  es.addEventListener("update", () => {
    if (drag) held = true;
    else if (!document.querySelector("form[data-dirty]")) refresh();
  });
  es.onerror = () => { document.body.dataset.stale = "1"; };
  es.onopen = () => { delete document.body.dataset.stale; };
})();
</script></head><body>
{{BODY}}
